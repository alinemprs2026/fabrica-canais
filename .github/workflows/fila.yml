name: fila
# Todo episódio novo que entra em fila/ é validado e produzido automaticamente.
on:
  push:
    paths: ["fila/**.json"]
jobs:
  achar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.l.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: l
        run: |
          L=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'fila/*.json' 'fila/**/*.json' | jq -R -s -c 'split("\n")|map(select(length>0))')
          echo "lista=$L" >> $GITHUB_OUTPUT; echo "$L"
  video:
    needs: achar
    if: needs.achar.outputs.lista != '[]'
    strategy:
      fail-fast: false
      matrix:
        episodio: ${{ fromJson(needs.achar.outputs.lista) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts numpy
      - name: Validar
        run: python ferramentas/validar.py "${{ matrix.episodio }}"
      - name: Produzir
        run: |
          chmod +x ferramentas/*.sh
          NOME=$(basename "${{ matrix.episodio }}" .json); echo "NOME=$NOME" >> $GITHUB_ENV
          ferramentas/produzir_ep.sh "${{ matrix.episodio }}" "saida/$NOME.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: saida/
          retention-days: 14
