name: produzir
on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "Caminho do episodio.json no repositório"
        required: true
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts numpy
      - name: Produzir
        run: |
          chmod +x ferramentas/*.sh
          NOME=$(basename "${{ inputs.episodio }}" .json)
          echo "NOME=$NOME" >> $GITHUB_ENV
          time ferramentas/produzir_ep.sh "${{ inputs.episodio }}" "saida/$NOME.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: saida/
          retention-days: 7
